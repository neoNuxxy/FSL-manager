<!DOCTYPE html>

<html>

  <head>

    <title>Login - FSL Mgr</title>

    <link rel="icon" type="image/x-icon" href="../../pics/CoaX_logo.png">
    <link rel="stylesheet" href="../css/guiMain.css">

    <script type="text/javascript" src="../js/login.js"></script>
 
</head>

  <body>

    <nav class="nav">

      <a class="nav-logo" style="display:flex; align-items:center; gap:10px;">

        <img src="../../pics/CoaX_logo.png" style="height:26px; width:auto;">

        FSL <span>Manager</span>

      </a>
   
    </nav>


  <div class="login-wrap">
  <div class="login-side">
    <div class="login-brand">FSL <span>Manager</span></div>

    <h2>Welcome</h2>
    <p>Log in to manage your FSL internships</p>
    <div class="login-form">
      <div class="login-field-group">
        <label>Username</label>
        <input id="txtUser" type="text" >
      </div>
      <div class="login-field-group">
        <label>Password</label>
        <input id="txtPass" type="password">
      </div>

      <button class="login-btn" onclick="login()">Log In</button>
    </div>
  </div>

  <div class="login-visual">
    <div class="login-visual-text">
      <div class="login-tag">FSL Platform</div>
      <h3>Manage internships, students, and documents in one place..</h3>
      <p>Time tracking and document uploads - synchronized in real time.</p>
       <img src ="../../pics/danci-dancing-cat.webp"  style= "height:220px; width:220px;">
    </div>
  </div>
</div>

  </body>
</html>

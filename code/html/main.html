<!DOCTYPE html>

<html>

  <head>

    <title>Login - FSL Mgr</title>

    <link rel="icon" type="image/x-icon" href="../../pics/CoaX_logo.png">
    <link rel="stylesheet" href="../css/guiMain.css">

    <script type="text/javascript" src="../js/login.js"></script>
 
</head>

  <body>

    <nav class="nav">

      <a class="nav-logo">FSL <span>Manager</span></a>
   
    </nav>


  <div class="login-wrap">
  <div class="login-side">
    <div class="login-brand">FSL <span>Manager</span></div>
    <h2>Bentornato</h2>
    <p>Accedi per gestire i tirocini FSL</p>
    <div class="login-form">
      <div class="login-field-group">
        <label>Username</label>
        <input id="txtUser" type="text" placeholder="es. mario.rossi">
      </div>
      <div class="login-field-group">
        <label>Password</label>
        <input id="txtPass" type="password" placeholder="••••••••">
      </div>

      <button class="login-btn" onclick="login()">Accedi →</button>
    </div>
  </div>

  <div class="login-visual">
    <div class="login-visual-text">
      <div class="login-tag">Piattaforma FSL</div>
      <h3>Gestisci tirocini, studenti e documenti in un unico posto.</h3>
      <p>Monitoraggio ore, upload documenti e comunicazione con i tutor — sincronizzati in tempo reale.</p>
       <img src ="../../pics/danci-dancing-cat.webp"  style= "height:220px; width:220px;">
    </div>
  </div>
</div>

  </body>
</html>

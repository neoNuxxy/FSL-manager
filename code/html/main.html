<!DOCTYPE html>

<html>

  <head>

    <title>Login - FSL Mgr</title>

    <link rel="icon" type="image/x-icon" href="../../pics/CoaX_logo.png">
    <link rel="stylesheet" href="../gui/guiMain.css">

    <script type="text/javascript" src="../js/login.js"></script>
 
</head>

  <body>

    <nav class="nav">

      <a class="nav-logo">FSL <span>Manager</span></a>
   
    </nav>


    <div class="login-wrap">

      <div class="login-side">

        <h2>welcome</h2>
        <p>Log in to manage your FSL internships</p>

        <div class="login-form">

          <input id="txtUser" type="text" placeholder="Username">
          <input id="txtPass" type="password" placeholder="Password">

          <div class="login-options">

            <label>

              <input type="checkbox"> Remember me

            </label>

            <span>Forgot password?</span>
          </div>

          <button class="login-btn" onclick="login()">Log in</button>

        </div>
      </div>

     
      <div class="login-visual">

        <div class="login-visual-text">

          <h3>FSL Manager</h3>
          <p>Manage internships, students, and documentation in one place.</p>
        </div>
      </div>

    </div>

  </body>
</html>

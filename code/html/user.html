<!DOCTYPE html>
<html>
  <head>
    <title>Student - FSL Mgr</title>
    <link rel="icon" type="image/x-icon" href="../../pics/CoaX_logo.png">
    <link rel="stylesheet" href="../css/guiUser.css">
    <script type="text/javascript" src="../js/user.js"></script>
  </head>
  <body>
    <nav class="nav">
      <a class="nav-logo">FSL <span>Manager</span></a>
    </nav>

    <div class="dash-layout">
      <div class="sidebar">
        <div class="sidebar-user">
          <div class="sidebar-avatar">ST</div>
          <div class="sidebar-name">Studente</div>
          <div class="sidebar-badge">Tirocinante</div>
        </div>
        <div class="sidebar-section">Menu</div>
        <a class="sidebar-item active">
          <span class="si">📋</span> Dashboard
        </a>
        <a class="sidebar-item">
          <span class="si">📄</span> Documenti
        </a>
      </div>

      <div class="dash-main">
        <div class="dash-topbar">
          <div>
            <h2>La mia Dashboard</h2>
            <p>Riepilogo tirocinio</p>
          </div>
          <button class="btn-primary" onclick="presence(); documentLoad(); saveFile()">
            💾 Salva
          </button>
        </div>

        <div class="student-top-grid">

          <!-- ORE -->
          <div class="dash-card">
            <h4>Ore Tirocinio</h4>
            <div class="hours-inner">
              <div class="hours-details" style="width: 100%;">
                <div class="form-group">
                  <label>Firma presenze</label>
                  <input id="txtSign" type="text" placeholder="es. 2024-06-01">
                </div>
                <div class="form-group" style="margin-top: 10px;">
                  <label>Ore svolte</label>
                  <input id="txtHourDone" type="number" placeholder="es. 120">
                </div>
              </div>
            </div>
          </div>

          <!-- DOCUMENTI -->
          <div class="dash-card">
            <h4>Documenti</h4>
            <div class="doc-item">
              <span class="doc-item-name">Convenzione firmata</span>
              <input id="txtSignedAgreement" type="text" class="doc-input" placeholder="Stato / link">
            </div>
            <div class="doc-item">
              <span class="doc-item-name">Progetto formativo</span>
              <input id="txtTrainingProject" type="text" class="doc-input" placeholder="Stato / link">
            </div>
            <div class="doc-item">
              <span class="doc-item-name">Relazione finale</span>
              <input id="txtFinalReport"     type="text" class="doc-input" placeholder="Stato / link">
            </div>
          </div>

        </div>
      </div>
    </div>
  </body>
</html>

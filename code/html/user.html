<!DOCTYPE html>
<html>
  <head>
    <title>Student - FSL Mgr</title>
    <link rel="icon" type="image/x-icon" href="../../pics/CoaX_logo.png">
    <link rel="stylesheet" href="../css/guiUser.css">
    <script type="text/javascript" src="../js/user.js"></script>
  </head>
  <body>
    <nav class="nav">
      <a class="nav-logo" style="display:flex; align-items:center; gap:10px;">

        <img src="../../pics/CoaX_logo.png" style="height:26px; width:auto;">

        FSL <span>Manager</span>

      </a>
    </nav>

    <div class="dash-layout">
      <div class="sidebar">
        <div class="sidebar-user">
          <div class="sidebar-avatar">ST</div>
          <div class="sidebar-badge">Student</div>
        </div>
        <div class="sidebar-section">Menu</div>
        <a class="sidebar-item active" onclick="showPage('dashboard', this)">
          <span class="si">📋</span> Dashboard
        </a>
        <a class="sidebar-item" onclick="showPage('documenti', this)">
          <span class="si">📄</span> Documents
        </a>
      </div>

      <div class="dash-main">

        <!-- PAGINA DASHBOARD -->
        <div id="page-dashboard">
          <div class="dash-topbar">
            <div>
              <h2>My Dashboard</h2>
              <p>Internship Summary</p>
            </div>
            <button class="btn-primary" onclick="presence(); documentLoad()">💾 Save</button>
          </div>

          <div class="student-top-grid">
            <div class="dash-card">
              <h4>Internship hours</h4>
              <div class="hours-inner">
                <div class="hours-details" style="width: 100%;">
                  <div class="form-group">
                    <label>Sign attendance</label>
                    <input id="txtSign" >
                  </div>
                  <div class="form-group" style="margin-top: 10px;">
                    <label>Hours worked</label>
                    <input id="txtHourDone" >
                  </div>
                </div>
              </div>
            </div>

            
          </div>
        </div>

        
        <div id="page-documenti" style="display:none;">
          <div class="dash-topbar">
            <div>
              <h2>Documents</h2>
              <p>Your internship documents</p>
            </div>
            <button class="btn-primary" onclick="presence(); documentLoad()">💾 Save</button>
          </div>
          <div class="dash-card">
              <h4>Documents</h4>
              <div class="doc-item">
                <span class="doc-item-name">Agreement signed</span>
                <input id="txtSignedAgreement" type="text" class="doc-input" placeholder="State / link">
              </div>
              <div class="doc-item">
                <span class="doc-item-name">Training project</span>
                <input id="txtTrainingProject" type="text" class="doc-input" placeholder="State / link">
              </div>
              <div class="doc-item">
                <span class="doc-item-name">Final report</span>
                <input id="txtFinalReport" type="text" class="doc-input" placeholder="State / link">
              </div>
            </div>
        </div>

      </div>
    </div>
  </body>
</html>
